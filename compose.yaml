# Switchyard: Caddy + its manager (CPM) on one host (spec §2, Deployment).
# install.sh sets this up; by hand:
#
#   docker compose up -d --build
#   docker compose --profile demo up -d --build   # also starts a test backend
#
# Caddy answers on 0.0.0.0:80 and :443; the UI on 0.0.0.0:8080. Each port
# can be moved in .env (SWITCHYARD_HTTP_PORT, SWITCHYARD_HTTPS_PORT,
# SWITCHYARD_UI_PORT), e.g. to test next to a proxy that already has 80/443.
# Caddy's admin API is only on a unix socket shared with CPM; port 2019 is
# never published.

name: ${COMPOSE_PROJECT_NAME:-switchyard}

services:
  caddy:
    build: ./caddy
    image: switchyard-caddy:local
    restart: unless-stopped
    # The image's entrypoint starts Caddy as uid 1000 with the last config
    # CPM applied, or caddy/bootstrap.json on a fresh install.
    ports:
      - "0.0.0.0:${SWITCHYARD_HTTP_PORT:-80}:80"
      - "0.0.0.0:${SWITCHYARD_HTTPS_PORT:-443}:443"
      - "0.0.0.0:${SWITCHYARD_HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - caddy-applied:/etc/caddy/cpm:ro
      - cpm-secrets:/run/cpm-secrets:ro
      - caddy-admin:/run/caddy
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      - geoip:/usr/share/GeoIP:ro
    healthcheck:
      # Healthy once the admin socket is up (unknown hosts answer 404, which
      # wget would count as a failure).
      test: ["CMD-SHELL", "test -S /run/caddy/admin.sock"]
      interval: 10s
      timeout: 3s
      start_period: 5s

  cpm:
    build:
      context: .
      args:
        VERSION: local
    image: switchyard:local
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    ports:
      - "0.0.0.0:${SWITCHYARD_UI_PORT:-8080}:8080"
    environment:
      CPM_LISTEN: 0.0.0.0:8080
      CPM_DATA_DIR: /data
      CPM_CADDY_ADMIN_SOCKET: /run/caddy/admin.sock
      CPM_CADDY_CONFIG_FILE: /caddy-applied/caddy.json
      CPM_CADDY_DATA_DIR: /caddy-data
      CPM_SECRETS_DIR: /run/cpm-secrets
      # Encrypts DNS provider tokens at rest. Set it in .env (see
      # .env.example); without it, DNS providers can't be added.
      CPM_SECRET_KEY: ${CPM_SECRET_KEY:-}
      # Optional: ACME directory (e.g. Let's Encrypt staging) and contact email.
      CPM_ACME_CA: ${CPM_ACME_CA:-}
      CPM_ACME_EMAIL: ${CPM_ACME_EMAIL:-}
      # Countries: DB-IP's free database is downloaded monthly unless "off".
      CPM_GEOIP_DOWNLOAD: ${CPM_GEOIP_DOWNLOAD:-on}
    volumes:
      - cpm-data:/data
      - caddy-applied:/caddy-applied
      - cpm-secrets:/run/cpm-secrets
      - caddy-admin:/run/caddy
      - caddy-data:/caddy-data:ro
      - caddy-logs:/var/log/caddy:ro
      - geoip:/usr/share/GeoIP:ro

  # Keeps the GeoLite2-Country database (country rules, dashboard) up to
  # date, weekly. Needs a free MaxMind account: put GEOIPUPDATE_ACCOUNT_ID
  # and GEOIPUPDATE_LICENSE_KEY in .env and start with `--profile geoip`.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    profiles: [geoip]
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: "168"
    volumes:
      - geoip:/usr/share/GeoIP

  # Test backend for trying CPM out: proxy a host to whoami:80. It echoes
  # back the request it received. Only runs with `--profile demo`.
  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    profiles: [demo]
    restart: unless-stopped

volumes:
  geoip:
  # DNS provider tokens as files, written by CPM and read by Caddy through
  # {file.…} placeholders. Encrypted copies live in CPM's database.
  cpm-secrets:
  caddy-admin:
  caddy-applied:
  caddy-data:
  caddy-config:
  caddy-logs:
  cpm-data:
